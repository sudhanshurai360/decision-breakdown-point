# Metadata only: this repository is a research deposit, not a distributable package (there is
# no [build-system] table and nothing here is meant to be `pip install`ed). The [project]
# table exists so the interpreter floor is machine-readable in the conventional place.
[project]
name = "decision-breakdown-point"
version = "1.0.0"
requires-python = ">=3.11"
# >=3.11 because requirements-lock.txt pins numpy 2.4.4, scipy 1.17.1 and contourpy 1.3.3,
# each of which declares Requires-Python >=3.11.

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true

# pytest configuration for the pipeline, gate and instrument code under code/.
